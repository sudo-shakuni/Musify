name: Musify CI & Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Python Syntax & Bytecode Compilation
      run: |
        python -m compileall backend desktop.py

    - name: Test Core Modules Import
      run: |
        python -c "import fastapi, uvicorn, mutagen, yt_dlp; print('All core audio & web engines loaded successfully!')"

    - name: Verify Web Distribution Assets
      run: |
        python -c "import os; assert os.path.exists('docs/index.html') and os.path.exists('docs/app.js') and os.path.exists('docs/style.css'), 'Missing docs assets'"
